[package]
name = "panebot"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "panebot"
path = "src/bin/panebot.rs"

[[bin]]
name = "panebot-daemon"
path = "src/bin/panebot-daemon.rs"

[dependencies]
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream"] }
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
