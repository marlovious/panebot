[package]
name    = "pbsend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pbsend"
path = "src/main.rs"

[dependencies]
tungstenite = { version = "0.24", features = ["native-tls"] }
native-tls  = "0.2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
url         = "2"
crossterm   = "0.27"
dirs = "6.0.0"
